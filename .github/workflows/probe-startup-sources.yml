name: Probe startup support sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-startup-sources.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Bizinfo listing
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.bizinfo.go.kr/web/lay1/program/S1T122C128/business/businessList.do'
          curl -L --fail --show-error --silent --connect-timeout 20 --max-time 60 \
            -A 'Mozilla/5.0' -o /tmp/bizinfo.html "$url"
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/bizinfo.html').read_text(encoding='utf-8',errors='replace')
          print('BIZINFO_BYTES',len(text.encode('utf-8')))
          for m in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', text, re.I|re.S):
              href,body=m
              label=re.sub(r'<[^>]+>',' ',body)
              label=re.sub(r'\s+',' ',label).strip()
              if 'business' in href.lower() or any(k in label for k in ['지원','창업','사업']):
                  print('LINK',href,'|',label[:240])
          PY
