name: Collect GitHub repository metrics

on:
  workflow_run:
    workflows: [Crawl daily-brief source inventories, Promote daily brief staging snapshot]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-brief-github-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_pipeline.mjs
      - name: Collect repository metrics
        id: metrics
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/collect_github_metrics.mjs
      - name: Save metrics and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh collected GitHub repository metrics"
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          fi
      - name: Report incomplete collection
        if: steps.metrics.outcome == 'failure'
        run: exit 1
