name: Promote daily brief staging snapshot

on:
  push:
    branches:
      - 'automation/daily-brief-*-data'
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: 'Staging branch to promote'
        required: true
        type: string

permissions:
  contents: write
  actions: write
  pages: read

concurrency:
  group: daily-brief-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve candidate ref
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ref="${{ inputs.candidate_ref }}"
          else
            ref="${{ github.ref_name }}"
          fi
          if [[ ! "$ref" =~ ^automation/daily-brief-([0-9]{4}-[0-9]{2}-[0-9]{2})-data$ ]]; then
            echo "Unexpected candidate ref: $ref" >&2
            exit 1
          fi
          date="${BASH_REMATCH[1]}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate candidate snapshot
        shell: bash
        run: |
          set -euo pipefail
          date='${{ steps.candidate.outputs.date }}'
          git fetch origin main
          current_date="$(git show origin/main:data/latest.json | python -c 'import json,sys; print(json.load(sys.stdin)["date"])')"
          if [[ "$date" < "$current_date" ]]; then
            echo "Refusing older snapshot $date: main already contains $current_date" >&2
            exit 1
          fi
          python scripts/test_research_rules.py
          python scripts/test_publication_bundle.py
          python scripts/validate_data.py data/latest.json
          test -f "data/archive/$date.json"
          test -f "data/research/$date.json"
          cmp --silent data/latest.json "data/archive/$date.json"
          git show origin/main:data/latest.json > /tmp/baseline-latest.json
          python scripts/validate_research_audit.py "data/research/$date.json" data/latest.json /tmp/baseline-latest.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = os.environ["EXPECTED_DATE"]
          data = json.loads(Path("data/latest.json").read_text(encoding="utf-8"))
          actual = data.get("date")
          if actual != expected:
              raise SystemExit(f"snapshot date {actual!r} does not match branch date {expected!r}")
          PY
        env:
          EXPECTED_DATE: ${{ steps.candidate.outputs.date }}

      - name: Enforce data-only candidate
        shell: bash
        run: |
          set -euo pipefail
          date='${{ steps.candidate.outputs.date }}'
          git fetch origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          if (( ${#changed[@]} == 0 )); then
            echo "Candidate has no changes relative to main."
          fi
          for path in "${changed[@]}"; do
            if [[ "$path" != "data/latest.json" && "$path" != "data/archive/$date.json" && "$path" != "data/research/$date.json" ]]; then
              echo "Candidate changed forbidden path: $path" >&2
              exit 1
            fi
          done

      - name: Promote snapshot to main
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          candidate='${{ steps.candidate.outputs.ref }}'
          date='${{ steps.candidate.outputs.date }}'
          git fetch origin "$candidate" main
          git checkout -B main origin/main
          current_date="$(python -c 'import json; print(json.load(open("data/latest.json", encoding="utf-8"))["date"])')"
          if [[ "$date" < "$current_date" ]]; then
            echo "Refusing older snapshot $date: current main is $current_date" >&2
            exit 1
          fi
          git checkout "origin/$candidate" -- data/latest.json "data/archive/$date.json" "data/research/$date.json"
          python scripts/validate_data.py data/latest.json
          cmp --silent data/latest.json "data/archive/$date.json"
          git show origin/main:data/latest.json > /tmp/baseline-latest.json
          python scripts/validate_research_audit.py "data/research/$date.json" data/latest.json /tmp/baseline-latest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest.json "data/archive/$date.json" "data/research/$date.json"

          if git diff --cached --quiet -- data/latest.json "data/archive/$date.json" "data/research/$date.json"; then
            echo "No data changes to promote."
            sha="$(git rev-parse HEAD)"
          else
            git commit -m "Update daily brief for $date"
            git push origin HEAD:main
            sha="$(git rev-parse HEAD)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch Pages validation and deployment
        id: pages_dispatch
        shell: bash
        run: |
          set -euo pipefail
          # The official workflow-dispatch API returns the exact run ID.
          # Avoid guessing from timestamps/SHAs while repository metrics advance main.
          response="$(gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -f ref=main \
            -f 'inputs[expected_date]=${{ steps.candidate.outputs.date }}' \
            -F return_run_details=true)"
          run_id="$(printf '%s' "$response" | jq -er '.workflow_run_id')"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Pages workflow
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.pages_dispatch.outputs.run_id }}'
          if gh run watch "$run_id" --exit-status; then
            exit 0
          fi
          # GitHub concurrency may evict a pending Pages run when metrics-only
          # refreshes are queued. Retry this exact cancelled run once; a failed
          # validator/deployment is never retried automatically.
          conclusion="$(gh run view "$run_id" --json conclusion --jq '.conclusion')"
          if [[ "$conclusion" != "cancelled" ]]; then
            exit 1
          fi
          echo "::warning::Dated Pages run $run_id was cancelled while queued; rerunning once."
          gh run rerun "$run_id"
          gh run watch "$run_id" --exit-status

      - name: Verify public site has the promoted daily snapshot
        shell: bash
        env:
          EXPECTED_DATE: ${{ steps.candidate.outputs.date }}
        run: |
          set -euo pipefail
          site_url="$(gh api "repos/${{ github.repository }}/pages" --jq '.html_url')"
          export LIVE_JSON_URL="${site_url%/}/data/latest.json"
          python - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          expected = os.environ['EXPECTED_DATE']
          local_bytes = Path('data/latest.json').read_bytes()
          expected_hash = hashlib.sha256(local_bytes).hexdigest()
          url = os.environ['LIVE_JSON_URL']
          for attempt in range(8):
              try:
                  query = urlencode({'verification': str(time.time_ns())})
                  req = Request(f'{url}?{query}', headers={'Cache-Control': 'no-cache'})
                  with urlopen(req, timeout=15) as response:
                      content = response.read()
                  actual_date = json.loads(content)['date']
                  if actual_date == expected and hashlib.sha256(content).hexdigest() == expected_hash:
                      print(f'PUBLICATION VERIFIED: {expected}, SHA256 {expected_hash}')
                      break
                  print(f'Public snapshot mismatch (attempt {attempt+1}/8): {actual_date}')
              except Exception as error:
                  print(f'Public snapshot read failed (attempt {attempt+1}/8): {error}')
              if attempt == 7:
                  raise SystemExit(f'Pages workflow completed but public snapshot {expected} was not verified')
              time.sleep(5)
          PY

      # Evolution is separate maintenance. It must not retroactively fail a
      # successfully validated and deployed editorial publication.
      - name: Dispatch crawler source evolution (best effort)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if ! gh workflow run evolve-crawler-sources.yml --ref main; then
            echo '::warning::Crawler evolution dispatch failed; editorial publication was already deployed.'
            exit 1
          fi
