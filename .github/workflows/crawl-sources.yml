name: Crawl daily-brief source inventories

on:
  push:
    branches:
      - 'automation/source-crawl-trigger'
    paths:
      - '.automation/source-crawl-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brief-source-crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install crawler dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test crawler source lifecycle engine
        run: python scripts/test_evolve_crawler_sources.py

      - name: Crawl source inventories
        run: npm run crawl:sources

      - name: Validate source cache
        shell: bash
        run: |
          set -euo pipefail
          date="$(TZ=Asia/Seoul date +%F)"
          test -f "data/source-cache/latest.json"
          test -f "data/source-cache/$date.json"
          cmp --silent "data/source-cache/latest.json" "data/source-cache/$date.json"
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/source-cache/latest.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("data/crawler-sources.json").read_text(encoding="utf-8"))
          active = manifest.get("active", [])
          required = {entry["key"] for entry in active if entry.get("required")}

          for entry in active:
              key = entry["key"]
              assert key in data["sources"], f"missing crawler source {key}"
              source = data["sources"][key]
              assert source["status"] in ("OK", "FAILED"), f"invalid crawler status for {key}"
              assert isinstance(source["items"], list), f"{key}.items must be a list"
              assert isinstance(source["actionableItems"], list), f"{key}.actionableItems must be a list"
              assert source["count"] == len(source["items"]), f"{key} count mismatch"
              assert source["actionableCount"] == len(source["actionableItems"]), f"{key} actionable count mismatch"
              if key in required:
                  assert source["status"] == "OK", f"mandatory crawler failed: {key}"
                  assert source["count"] > 0, f"mandatory crawler empty: {key}"

          shadow_expected = {
              entry["key"]
              for entry in manifest.get("nextCandidates", [])
              if entry.get("status") == "SHADOW" and entry.get("crawlerSpec")
          } | {
              entry["key"]
              for entry in manifest.get("degraded", [])
              if entry.get("crawlerSpec") or entry["key"] in {
                  "daconCompetitions","dakerHackathons","hackathonKorea","sotong24Contests",
                  "grantlySupport","devpostOpen","contestKorea","kStartupHighlights"
              }
          }
          for key in shadow_expected:
              assert key in data.get("shadowSources", {}), f"missing shadow crawler result {key}"

          print("OK:", data["date"])
          for key, source in data["sources"].items():
              print("active", key, source["status"], source["count"], source["actionableCount"])
          for key, source in data.get("shadowSources", {}).items():
              print("shadow", key, source["status"], source["count"], source["actionableCount"])
          PY

      - name: Commit source cache to main
        shell: bash
        run: |
          set -euo pipefail
          date="$(TZ=Asia/Seoul date +%F)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/source-cache/latest.json "data/source-cache/$date.json"

          if git diff --cached --quiet; then
            echo "Source cache already current."
            exit 0
          fi

          git commit -m "Refresh source cache for $date"
          git pull --rebase origin main
          git push origin HEAD:main
