name: Probe daily brief primary source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-primary-source.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe NongNet hackathon official page
        shell: bash
        run: |
          set -euo pipefail
          url='https://hackathon.imaginationgroup.co.kr/nongnet'
          echo "URL=$url"
          curl -L --fail --show-error --silent --connect-timeout 20 --max-time 60 \
            -A 'Mozilla/5.0 (compatible; daily-brief-primary-source-verifier/1.0)' \
            -D /tmp/headers.txt -o /tmp/body.html "$url"
          echo '--- HEADERS ---'
          cat /tmp/headers.txt
          echo '--- FINAL URL ---'
          curl -L --fail --show-error --silent --connect-timeout 20 --max-time 60 \
            -A 'Mozilla/5.0 (compatible; daily-brief-primary-source-verifier/1.0)' \
            -o /dev/null -w '%{url_effective}\n' "$url"
          echo '--- BODY MATCHES ---'
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('/tmp/body.html').read_text(encoding='utf-8', errors='replace')
          print('bytes=', len(text.encode('utf-8')))
          for pattern in [
              r'.{0,120}2026 AI 농산물 가격예측 온라인 해커톤.{0,240}',
              r'.{0,120}10[./-]?(?:13|18).{0,240}',
              r'.{0,120}참가.{0,160}',
              r'.{0,120}접수.{0,160}',
          ]:
              matches = re.findall(pattern, text, flags=re.I|re.S)
              for match in matches[:10]:
                  print(re.sub(r'\s+', ' ', match)[:700])
          PY
