name: Validate daily brief candidate
on:
  pull_request:
    branches: [main]
    paths:
      - data/latest.json
      - data/archive/2026-09-25.json

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_data.py
      - run: cmp data/latest.json data/archive/2026-09-25.json
