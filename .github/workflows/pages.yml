name: Deploy daily-brief to GitHub Pages
run-name: Deploy daily-brief ${{ inputs.expected_date || 'latest' }}
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/source-cache/**'
      - 'data/crawler-sources.json'
      - 'data/crawler-source-state.json'
  workflow_dispatch:
    inputs:
      expected_date:
        description: 'Dated editorial snapshot to verify (YYYY-MM-DD); omit for metrics-only refresh'
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Metrics refreshes must not cancel a dated editorial deployment in progress.
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_data.py
      - name: Verify dated editorial payload when requested
        shell: bash
        env:
          EXPECTED_DATE: ${{ inputs.expected_date }}
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_DATE" ]]; then
            echo "Metrics/site refresh: no new editorial publication claimed."
            exit 0
          fi
          if [[ ! "$EXPECTED_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid expected date" >&2
            exit 1
          fi
          test -f "data/archive/$EXPECTED_DATE.json"
          test -f "data/research/$EXPECTED_DATE.json"
          cmp --silent data/latest.json "data/archive/$EXPECTED_DATE.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          expected = os.environ['EXPECTED_DATE']
          snapshot = json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          audit = json.loads(Path(f'data/research/{expected}.json').read_text(encoding='utf-8'))
          assert snapshot.get('date') == expected, 'Pages snapshot date mismatch'
          assert audit.get('date') == expected and audit.get('completedAt'), 'Pages research evidence missing or wrong date'
          PY
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
