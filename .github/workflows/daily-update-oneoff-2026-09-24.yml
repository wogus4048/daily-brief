name: Daily brief one-off 2026-09-24

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_daily_update_2026_09_24.py
      - .github/workflows/daily-update-oneoff-2026-09-24.yml

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply researched daily snapshot
        run: python scripts/apply_daily_update_2026_09_24.py
      - name: Validate snapshot
        run: python scripts/validate_data.py
      - name: Verify latest/archive byte identity
        run: cmp data/latest.json data/archive/2026-09-24.json
      - name: Commit final snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/apply_daily_update_2026_09_24.py
          rm .github/workflows/daily-update-oneoff-2026-09-24.yml
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "Update daily brief for 2026-09-24"
          git push origin HEAD:main

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for preliminary Pages run to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in {1..60}; do
            statuses="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20" --jq '[.workflow_runs[] | select(.name=="Deploy daily-brief to GitHub Pages") | .status] | join(",")')"
            if [[ "$statuses" != *queued* && "$statuses" != *in_progress* && "$statuses" != *waiting* && "$statuses" != *requested* && "$statuses" != *pending* ]]; then
              echo "Preliminary Pages run is no longer active: ${statuses:-none}"
              exit 0
            fi
            echo "Waiting for preliminary Pages run: $statuses"
            sleep 5
          done
          echo "Timed out waiting for preliminary Pages run"
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate final main snapshot
        run: python scripts/validate_data.py
      - name: Verify final latest/archive byte identity
        run: cmp data/latest.json data/archive/2026-09-24.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy final main snapshot
        id: deployment
        uses: actions/deploy-pages@v4
